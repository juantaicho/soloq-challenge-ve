<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoloQ Challenge Venezuela</title>
  <style>
    /* Estilos Base y Tipografía */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;800&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0b0507;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    /* Cabecera */
    header { text-align: center; margin-bottom: 30px; }
    
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.8rem;
      font-weight: 900;
      color: #d4af37; /* Dorado clásico */
      text-transform: uppercase;
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      margin-bottom: 8px;
    }
    
    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 15px;
    }
    
    .status-bar {
      font-size: 0.8rem;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .status-live {
      color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      border: 1px solid rgba(74, 222, 128, 0.2);
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
    }

    /* Filtros (Botones) */
    .filters {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }
    .filter-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .filter-btn.active {
      background: rgba(225, 29, 72, 0.1);
      border-color: #e11d48;
      color: #fff;
      box-shadow: 0 0 15px rgba(225, 29, 72, 0.3);
    }

    /* Tabla */
    .table-container {
      width: 100%;
      max-width: 1000px;
      background: linear-gradient(180deg, #111 0%, #0a0a0a 100%);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      overflow-x: auto;
    }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 18px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    
    th {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: #d4af37;
      letter-spacing: 0.1em;
    }
    
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255, 255, 255, 0.02); }
    
    /* Celdas Específicas */
    .pos {
      font-weight: 900;
      font-size: 1.2rem;
      color: #d4af37;
      text-align: center;
      width: 60px;
    }
    
    .player-name { font-weight: 800; color: #fff; font-size: 1.05rem; display: block; }
    .player-tag { font-size: 0.75rem; color: #64748b; font-weight: 600; }
    
    /* Badges de Categoría por Colores */
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }
    .badge-high { border: 1px solid #ef4444; color: #ef4444; }
    .badge-mid  { border: 1px solid #14b8a6; color: #14b8a6; }
    .badge-low  { border: 1px solid #d4af37; color: #d4af37; }
    .badge-default { border: 1px solid #64748b; color: #64748b; }

    /* Rango y LP */
    .rank-tier { font-weight: 800; color: #e2e8f0; font-size: 0.95rem; }
    .lp-text { color: #14b8a6; font-weight: 700; font-size: 0.9rem; }
    
    /* Barra de Winrate Visual */
    .wr-container { display: flex; align-items: center; gap: 12px; }
    .wr-bar-bg {
      width: 60px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      overflow: hidden;
    }
    .wr-bar-fill { height: 100%; background: #14b8a6; border-radius: 3px; }
    .wr-percent { font-weight: 700; color: #e2e8f0; font-size: 0.9rem; width: 45px; }
    .record-cell { color: #94a3b8; font-size: 0.85rem; font-weight: 600; }
    
  </style>
</head>
<body>

  <header>
    <h1>SoloQ Challenge Venezuela</h1>
    <p class="subtitle">Ranking Oficial de Creadores de Contenido</p>
    <div class="status-bar status-live"

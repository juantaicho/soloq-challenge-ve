<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SoloQ Challenge Widget</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@600;700&display=swap');

    body {
      margin: 0;
      padding: 16px;
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      color: #f0e6d2;
      width: 320px;
      box-sizing: border-box;
    }

    .widget-container {
      background: linear-gradient(180deg, rgba(20, 10, 15, 0.95) 0%, rgba(10, 5, 8, 0.95) 100%);
      border: 1px solid #785a28;
      border-top: 3px solid #c8aa6e;
      border-radius: 6px;
      padding: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 10px rgba(120, 90, 40, 0.2);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(200, 170, 110, 0.2);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .title {
      font-family: 'Cinzel', serif;
      font-size: 13px;
      letter-spacing: 1px;
      color: #c8aa6e;
      text-transform: uppercase;
    }

    .badge-category {
      font-size: 10px;
      background: #3c141e;
      color: #ff4655;
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: bold;
      text-transform: uppercase;
      border: 1px solid #ff4655;
    }

    .main-player {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .rank-pos {
      font-size: 26px;
      font-weight: 700;
      color: #c8aa6e;
      min-width: 36px;
      text-align: center;
      border-right: 1px solid rgba(200, 170, 110, 0.3);
      padding-right: 8px;
    }

    .player-details {
      flex-grow: 1;
    }

    .player-name {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }

    .player-rank-lp {
      font-size: 14px;
      color: #0ac8b9;
      font-weight: 700;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      color: #a09b8c;
    }

    .stats-row span b {
      color: #f0e6d2;
    }
  </style>
</head>
<body>

  <div class="widget-container" id="widget">
    <div class="header">
      <span class="title">SoloQ Challenge VE</span>
      <span class="badge-category" id="playerCategory">--</span>
    </div>
    
    <div class="main-player">
      <div class="rank-pos" id="playerPos">#-</div>
      <div class="player-details">
        <div class="player-name" id="playerName">Cargando...</div>
        <div class="player-rank-lp" id="playerTierLp">--</div>
      </div>
    </div>

    <div class="stats-row">
      <span>WR: <b id="playerWr">0%</b></span>
      <span>W/L: <b id="playerWl">0G</b></span>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetName = urlParams.get('player') || 'JuanTaicho';

    async function updateWidget() {
      try {
        const res = await fetch(`leaderboard.json?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        
        const player = data.find(p => p.name.toLowerCase() === targetName.toLowerCase());
        
        if (player) {
          document.getElementById('playerName').textContent = `${player.name} #${player.tag}`;
          document.getElementById('playerPos').textContent = `#${player.position}`;
          document.getElementById('playerCategory').textContent = player.category;
          
          const rankText = player.tier === 'UNRANKED' 
            ? 'UNRANKED' 
            : `${player.tier} ${player.rank} - ${player.lp} LP`;
          document.getElementById('playerTierLp').textContent = rankText;
          
          document.getElementById('playerWr').textContent = `${player.winrate}%`;
          document.getElementById('playerWl').textContent = `${player.wins}V / ${player.losses}D`;
        }
      } catch (err) {
        console.error("Error al actualizar widget:", err);
      }
    }

    updateWidget();
    // Refrescar cada 60 segundos dentro de OBS
    setInterval(updateWidget, 60000);
  </script>
</body>
</html>

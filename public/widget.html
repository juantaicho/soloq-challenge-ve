<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SQCV Overlay Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 16px;
    }
    .widget-container {
      width: 270px;
      background: linear-gradient(180deg, rgba(28, 10, 18, 0.96) 0%, rgba(12, 4, 8, 0.98) 100%);
      border: 1.5px solid rgba(225, 29, 72, 0.6);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(225, 29, 72, 0.15);
      padding: 14px;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(225, 29, 72, 0.3);
      padding-bottom: 6px;
    }
    .position-badge {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f43f5e;
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    }
    .category-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(225, 29, 72, 0.25);
      border: 1px solid rgba(225, 29, 72, 0.5);
      color: #fda4af;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .player-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      overflow: hidden;
    }
    .player-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .rank-card {
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;

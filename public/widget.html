<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SQCV Overlay Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 100vw;
      height: 100vh;
      padding: 10px;
    }
    .widget-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, rgba(20, 10, 15, 0.92), rgba(35, 12, 22, 0.95));
      border: 1px solid rgba(220, 38, 38, 0.4);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6), 0 0 10px rgba(220, 38, 38, 0.2);
      border-radius: 8px;
      padding: 8px 16px;
      color: #fff;
      min-width: 280px;
    }
    .position-badge {
      font-size: 1.4rem;
      font-weight: 800;
      color: #ef4444;
      min-width: 32px;
      text-align: center;
    }
    .player-info {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-size: 1rem;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .player-tag {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 500;
    }
    .player-rank {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fbbf24;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .player-lp {
      color: #38bdf8;
    }
    .player-wr {
      font-size: 0.75rem;
      color: #a3a3a3;
    }
  </style>
</head>
<body>
  <div class="widget-card" id="widget">
    <div class="position-badge" id="pos">#-</div>
    <div class="player-info">
      <div class="player-name">
        <span id="name">Cargando...</span>
        <span class="player-tag" id="tag"></span>
      </div>
      <div class="player-rank">
        <span id="rank">-</span>
        <span class="player-lp" id="lp">- LP</span>
        <span class="player-wr" id="wr">(-% WR)</span>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetPuuid = params.get('puuid');
    const targetPlayer = params.get('player');
    const targetTag = params.get('tag');

    async function updateWidget() {
      try {
        const res = await fetch(`leaderboard.json?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();

        // 1. Prioridad: Buscar por PUUID único
        let player = null;
        if (targetPuuid) {
          player = data.find(p => p.puuid === targetPuuid);
        }
        // 2. Alternativa: Buscar por Nombre y Tag combinados
        else if (targetPlayer && targetTag) {
          player = data.find(p => 
            p.name.toLowerCase() === targetPlayer.toLowerCase() &&
            p.tag.toLowerCase() === targetTag.toLowerCase()
          );
        } 
        // 3. Fallback: Buscar solo por Nombre si no hay duplicado
        else if (targetPlayer) {
          player = data.find(p => p.name.toLowerCase() === targetPlayer.toLowerCase());
        }

        if (player) {
          document.getElementById('pos').textContent = `#${player.position}`;
          document.getElementById('name').textContent = player.name;
          document.getElementById('tag').textContent = `#${player.tag}`;
          
          const rankText = player.tier === 'UNRANKED' 
            ? 'UNRANKED' 
            : `${player.tier} ${player.rank}`;
            
          document.getElementById('rank').textContent = rankText;
          document.getElementById('lp').textContent = `${player.lp} LP`;
          document.getElementById('wr').textContent = `(${player.winrate}% WR)`;
        } else {
          document.getElementById('name').textContent = "Jugador no hallado";
        }
      } catch (err) {
        console.error("Error al actualizar widget:", err);
      }
    }

    updateWidget();
    setInterval(updateWidget, 60000); // Refresco cada 60s
  </script>
</body>
</html>

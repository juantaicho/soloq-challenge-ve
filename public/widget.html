<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SQCV Overlay Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 12px;
    }
    .widget-container {
      width: 270px;
      background: linear-gradient(180deg, rgba(24, 10, 15, 0.95) 0%, rgba(10, 4, 7, 0.98) 100%);
      border: 1.5px solid rgba(225, 29, 72, 0.6);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 0 0 12px rgba(225, 29, 72, 0.2);
      padding: 14px;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(225, 29, 72, 0.3);
      padding-bottom: 6px;
    }
    .position-badge {
      font-size: 1.4rem;
      font-weight: 900;
      color: #f43f5e;
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    }
    .category-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(225, 29, 72, 0.25);
      border: 1px solid rgba(225, 29, 72, 0.5);
      color: #fda4af;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .player-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      overflow: hidden;
    }
    .player-name {
      font-size: 1.1rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .rank-card {
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .rank-tier {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .lp-val {
      color: #38bdf8;
      font-weight: 700;
    }
    .wr-val {
      color: #a1a1aa;
      font-size: 0.78rem;
    }
    .status-msg {
      font-size: 0.85rem;
      color: #f87171;
      text-align: center;
      padding: 10px 0;
    }
  </style>
</head>
<body>
  <div class="widget-container" id="widget">
    <div class="header-row">
      <div class="position-badge" id="pos">#-</div>
      <div class="category-tag" id="category">SQCV</div>
    </div>
    
    <div class="player-row">
      <span class="player-name" id="name">Cargando...</span>
      <span class="player-tag" id="tag"></span>
    </div>

    <div class="rank-card" id="rank-card">
      <div class="rank-tier" id="rank">Consultando datos...</div>
      <div class="stats-row">
        <span class="lp-val" id="lp">- LP</span>
        <span class="wr-val" id="wr">-</span>
      </div>
    </div>
  </div>

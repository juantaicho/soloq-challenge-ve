<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SQCV Overlay Widget</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    html, body {
      background: transparent;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 16px;
    }
    .widget-container {
      width: 270px;
      background: linear-gradient(180deg, rgba(28, 10, 18, 0.96) 0%, rgba(12, 4, 8, 0.98) 100%);
      border: 1.5px solid rgba(225, 29, 72, 0.6);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(225, 29, 72, 0.15);
      padding: 14px;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(225, 29, 72, 0.3);
      padding-bottom: 6px;
    }
    .position-badge {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f43f5e;
      text-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
    }
    .category-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(225, 29, 72, 0.25);
      border: 1px solid rgba(225, 29, 72, 0.5);
      color: #fda4af;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .player-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
      overflow: hidden;
    }
    .player-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .player-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .rank-card {
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rank-tier {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e2e8f0;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 600;
    }
    .lp-val {
      color: #38bdf8;
      font-weight: 700;
    }
    .wr-val {
      color: #a1a1aa;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="header-row">
      <div class="position-badge" id="pos">#-</div>
      <div class="category-tag" id="category">SQCV</div>
    </div>
    
    <div class="player-row">
      <span class="player-name" id="name">Cargando...</span>
      <span class="player-tag" id="tag"></span>
    </div>

    <div class="rank-card">
      <div class="rank-tier" id="rank">-</div>
      <div class="stats-row">
        <span class="lp-val" id="lp">- LP</span>
        <span class="wr-val" id="wr">-</span>
      </div>
    </div>
  </div>

  <script>
    async function init() {
      const nameEl = document.getElementById('name');
      const rankEl = document.getElementById('rank');
      const lpEl = document.getElementById('lp');

      // 1. Obtener el parámetro de la URL
      const params = new URLSearchParams(window.location.search);
      const queryPlayer = (params.get('player') || '').trim().toLowerCase();

      if (!queryPlayer) {
        nameEl.textContent = "Falta ?player=";
        rankEl.textContent = "Indica un nombre en la URL";
        return;
      }

      try {
        // 2. Fetch directo al JSON con cache-busting
        // Reemplaza la URL del fetch por esta:
const res = await fetch(`https://raw.githubusercontent.com/juantaicho/soloq-challenge-ve/main/public/leaderboard.json?v=${Date.now()}`);
        
        const data = await res.json();
        
        // 3. Buscar coincidencia flexible
        const match = data.find(p => {
          const playerName = (p.name || '').trim().toLowerCase();
          return playerName === queryPlayer;
        });

        if (match) {
          document.getElementById('pos').textContent = `#${match.position ?? '-'}`;
          nameEl.textContent = match.name;
          document.getElementById('tag').textContent = match.tag ? `#${match.tag}` : '';
          document.getElementById('category').textContent = match.category || 'SQCV';

          const tier = (match.tier && match.tier !== 'UNRANKED') 
            ? `${match.tier} ${match.rank || ''}`.trim()
            : 'UNRANKED';

          rankEl.textContent = tier;
          lpEl.textContent = `${match.lp ?? 0} LP`;
          
          const wr = match.winrate !== undefined ? match.winrate : 0;
          const wins = match.wins ?? 0;
          const losses = match.losses ?? 0;
          document.getElementById('wr').textContent = `${wr}% WR (${wins}W ${losses}L)`;
        } else {
          // Si no encuentra el nombre, te muestra qué nombres sí vinieron en el JSON
          nameEl.textContent = "No coincide";
          const nombresEnJson = data.map(p => p.name).filter(Boolean).join(', ');
          rankEl.textContent = `Buscaste: "${params.get('player')}"`;
          lpEl.textContent = `En JSON: [${nombresEnJson}]`;
        }
      } catch (err) {
        nameEl.textContent = "Error Script";
        rankEl.textContent = err.message;
      }
    }

    init();
    setInterval(init, 60000);
  </script>
</body>
</html>

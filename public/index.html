<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoloQ Challenge Venezuela - Leaderboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    body {
      background-color: #0b0507;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: #f43f5e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-shadow: 0 0 15px rgba(244, 63, 94, 0.4);
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 5px;
    }
    .table-container {
      width: 100%;
      max-width: 900px;
      background: linear-gradient(180deg, rgba(28, 10, 18, 0.95) 0%, rgba(12, 4, 8, 0.98) 100%);
      border: 1px solid rgba(225, 29, 72, 0.4);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(225, 29, 72, 0.1);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(225, 29, 72, 0.15);
    }
    th {
      background: rgba(0, 0, 0, 0.4);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #fda4af;
      font-weight: 700;
    }
    tr:last-child td {
      border-bottom: none;
    }
    tr:hover td {
      background: rgba(225, 29, 72, 0.05);
    }
    .pos {
      font-weight: 900;
      font-size: 1.1rem;
      color: #f43f5e;
      text-align: center;
      width: 50px;
    }
    .player-cell {
      display: flex;
      flex-direction: column;
    }
    .player-name {
      font-weight: 700;
      color: #ffffff;
      font-size: 1rem;
    }
    .player-tag {
      font-size: 0.75rem;
      color: #94a3b8;
    }
    .category-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: rgba(225, 29, 72, 0.2);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #fda4af;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .rank-tier {
      font-weight: 700;
      color: #e2e8f0;
      font-size: 0.95rem;
    }
    .lp-cell {
      font-weight: 700;
      color: #38bdf8;
    }
    .wr-cell {
      color: #a1a1aa;
      font-size: 0.85rem;
    }
    .loading-status {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }
  </style>
</head>

    <h1>SoloQ Challenge Venezuela</h1>
    <p class="subtitle">Tabla de Clasificación Oficial en Vivo</p>
  </header>

    <table id="leaderboard-table">
